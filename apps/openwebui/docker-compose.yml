services:
  open-webui:
    build:
      args:
        OLLAMA_BASE_URL: '/ollama'
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui
    volumes:
      - openweb-ui-data:/app/backend/data
    ports:
      - 9000:8080
    env_file:
      - .env.sample
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: always

volumes:
  openweb-ui-data: {}
